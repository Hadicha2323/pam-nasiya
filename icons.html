<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>PAM Ikonka Yaratish</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: linear-gradient(135deg, #06080f, #1a1f30); color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .container { max-width: 500px; width: 100%; background: rgba(15, 20, 35, 0.9); border: 1px solid rgba(239,45,45,0.3); border-radius: 20px; padding: 30px; text-align: center; }
  h1 { font-size: 22px; margin-bottom: 8px; color: #ef2d2d; }
  p { font-size: 13px; color: #8b95b8; margin-bottom: 20px; }
  .upload-box { border: 2px dashed rgba(239,45,45,0.5); border-radius: 16px; padding: 30px; margin-bottom: 20px; background: rgba(239,45,45,0.05); cursor: pointer; }
  .upload-box:hover { background: rgba(239,45,45,0.1); border-color: #ef2d2d; }
  .upload-box.done { border-color: #10b981; border-style: solid; background: rgba(16,185,129,0.08); }
  .upload-box svg { width: 48px; height: 48px; stroke: #ef2d2d; stroke-width: 2; fill: none; margin-bottom: 10px; }
  .upload-box h3 { font-size: 14px; margin-bottom: 6px; color: #fff; }
  .upload-box p { font-size: 11px; margin: 0; }
  #fileInput { display: none; }
  .preview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .preview-item { background: #fff; border-radius: 12px; padding: 12px; }
  .preview-item canvas { border-radius: 8px; max-width: 100%; }
  .preview-item .label { font-size: 11px; font-weight: 800; color: #1a1a1a; margin-top: 8px; }
  .btn { display: block; width: 100%; padding: 16px; border: none; border-radius: 14px; font-size: 15px; font-weight: 800; cursor: pointer; color: white; margin-bottom: 10px; }
  .btn-192 { background: linear-gradient(135deg, #ef2d2d, #c41010); }
  .btn-512 { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { color: #6ee7b7; font-weight: 700; min-height: 20px; margin-top: 12px; }
  .steps { text-align: left; margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 12px; color: #8b95b8; line-height: 1.7; }
  .steps b { color: #fff; }
  .steps ol { padding-left: 20px; margin-top: 8px; }
  .steps code { background: rgba(239,45,45,0.15); color: #ff8a8a; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
</style>
</head>
<body>
<div class="container">
  <h1>🎨 PAM Ikonka Yaratish</h1>
  <p>Logotipingizni yuklang — ikonkalar avtomatik yaratiladi</p>

  <div class="upload-box" id="uploadBox" onclick="document.getElementById('fileInput').click()">
    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    <h3 id="uploadTitle">Logotipni yuklash uchun bosing</h3>
    <p id="uploadDesc">PNG, JPG yoki SVG</p>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <div class="preview-grid" id="previewGrid" style="display:none;">
    <div class="preview-item"><canvas id="preview192"></canvas><div class="label">192×192</div></div>
    <div class="preview-item"><canvas id="preview512"></canvas><div class="label">512×512</div></div>
  </div>

  <button class="btn btn-192" id="btn192" onclick="downloadIcon(192)" disabled>⬇ icon-192.png</button>
  <button class="btn btn-512" id="btn512" onclick="downloadIcon(512)" disabled>⬇ icon-512.png</button>
  <div class="status" id="status"></div>

  <div class="steps">
    <b>📋 Qadamlar:</b>
    <ol>
      <li>Logoni yuklang va 2 tugmani bosing</li>
      <li>2 ta PNG yuklab olinadi</li>
      <li>Ularni <b>index.html</b> yoniga tashlang</li>
      <li>GitHub'ga push qiling</li>
    </ol>
  </div>
</div>
<script>
var logoImage = null;
document.getElementById('fileInput').addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    var img = new Image();
    img.onload = function() {
      logoImage = img;
      document.getElementById('previewGrid').style.display = 'grid';
      renderPreview(192, 'preview192');
      renderPreview(512, 'preview512');
      document.getElementById('btn192').disabled = false;
      document.getElementById('btn512').disabled = false;
      document.getElementById('uploadBox').classList.add('done');
      document.getElementById('uploadTitle').textContent = '✅ ' + file.name;
      document.getElementById('uploadDesc').textContent = 'Endi pastdagi tugmalarni bosing';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});
function drawLogo(canvas, size) {
  canvas.width = size; canvas.height = size;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, size, size);
  if (!logoImage) return;
  var r = logoImage.width / logoImage.height;
  var dw, dh, dx, dy;
  if (r > 1) { dw = size * 0.88; dh = dw / r; dx = (size - dw) / 2; dy = (size - dh) / 2; }
  else { dh = size * 0.88; dw = dh * r; dx = (size - dw) / 2; dy = (size - dh) / 2; }
  ctx.drawImage(logoImage, dx, dy, dw, dh);
}
function renderPreview(size, id) {
  var c = document.getElementById(id);
  c.width = size; c.height = size; c.style.width = '140px'; c.style.height = '140px';
  drawLogo(c, size);
}
function downloadIcon(size) {
  if (!logoImage) return;
  var c = document.createElement('canvas');
  drawLogo(c, size);
  c.toBlob(function(blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'icon-' + size + '.png';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
    document.getElementById('status').textContent = '✅ icon-' + size + '.png yuklab olindi!';
  }, 'image/png');
}
</script>
</body>
</html>
